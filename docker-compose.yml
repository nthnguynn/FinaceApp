services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: finance_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Không mở cổng ra ngoài: app nối vào DB qua mạng nội bộ của Docker.
    # Cần vào DB thì dùng: docker compose exec postgres psql -U "$POSTGRES_USER" "$POSTGRES_DB"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance_app
    restart: always
    ports:
      - "${APP_PORT:-3005}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      - postgres

volumes:
  postgres_data:
